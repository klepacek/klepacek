name: GitHub Metrics
on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: klepacek
          template: classic
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Prague
          config_octicon: yes
          config_twemoji: yes
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          extras_css: |
            svg:root { background: #08051b; border-radius: 14px; color: #c4b5d9; }
            h1, h2, h3 { color: #c084fc; }
            .field svg { fill: #a78bfa; }
            footer { color: #9c8aaf; }
            :root {
              --color-calendar-graph-day-bg: #17102e;
              --color-calendar-graph-day-L1-bg: #3b1764;
              --color-calendar-graph-day-L2-bg: #6d28a8;
              --color-calendar-graph-day-L3-bg: #a855f7;
              --color-calendar-graph-day-L4-bg: #e879f9;
            }
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
